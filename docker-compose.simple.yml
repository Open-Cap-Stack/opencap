version: "3.8"

# Simplified Docker Compose for local development
# Uses ZeroDB as the primary database (no local database required)

services:
  # Backend API Service
  app:
    build:
      context: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    working_dir: /app
    command: sh -c "npm install && node app.js"
    environment:
      # ZeroDB Configuration (Primary Database)
      - ENABLE_ZERODB=true
      - ZERODB_API_KEY=${ZERODB_API_KEY}
      - ZERODB_BASE_URL=https://api.ainative.studio/api/v1
      - ZERODB_PROJECT_ID=${ZERODB_PROJECT_ID:-}
      - AINATIVE_API_TOKEN=${AINATIVE_API_TOKEN}
      # Server Configuration
      - NODE_ENV=development
      - PORT=5000
      - CORS_ORIGIN=http://localhost:5173

  # Frontend React Service
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:5000/api/v1
    depends_on:
      - app

volumes:
  backend_node_modules:
  frontend_node_modules:
