<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E3A5F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1E40AF" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1E40AF" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1E40AF" stroke-width="1" opacity="0.3"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1E40AF" stroke-width="1" opacity="0.3"/>

  <!-- Logo mark: 3 bar chart bars -->
  <rect x="100" y="220" width="48" height="140" rx="8" fill="url(#accentGrad)"/>
  <rect x="164" y="170" width="48" height="190" rx="8" fill="url(#accentGrad)" opacity="0.85"/>
  <rect x="228" y="130" width="48" height="230" rx="8" fill="url(#accentGrad)" opacity="0.7"/>

  <!-- Brand name -->
  <text x="320" y="285" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="72" fill="#F8FAFC" letter-spacing="-2">OpenCap Stack</text>

  <!-- Tagline -->
  <text x="320" y="345" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="32" fill="#94A3B8">Cap Table &amp; Equity Management for Startups</text>

  <!-- Accent line -->
  <rect x="100" y="390" width="1000" height="3" rx="2" fill="url(#accentGrad)" opacity="0.6"/>

  <!-- Feature pills -->
  <rect x="100" y="430" width="180" height="44" rx="22" fill="#1E40AF" opacity="0.6"/>
  <text x="190" y="458" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#BFDBFE">Cap Tables</text>

  <rect x="300" y="430" width="160" height="44" rx="22" fill="#1E40AF" opacity="0.6"/>
  <text x="380" y="458" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#BFDBFE">409A</text>

  <rect x="480" y="430" width="200" height="44" rx="22" fill="#1E40AF" opacity="0.6"/>
  <text x="580" y="458" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#BFDBFE">SAFE Notes</text>

  <rect x="700" y="430" width="220" height="44" rx="22" fill="#1E40AF" opacity="0.6"/>
  <text x="810" y="458" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#BFDBFE">SPV Management</text>

  <rect x="940" y="430" width="160" height="44" rx="22" fill="#1E40AF" opacity="0.6"/>
  <text x="1020" y="458" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#BFDBFE">OCTA v2.0</text>

  <!-- URL -->
  <text x="600" y="570" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#64748B">opencapstack.com</text>
</svg>
