<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" fill="#1a1a1a">
  <!--
    OCS S-mark: a hexagonal outline with a bold S-shaped cutout.
    The S is formed by two horizontally-mirrored C shapes stacked vertically.
    Top C opens right, bottom C opens left — creating the S.
  -->
  <path d="
    M50 2
    L88 22
    L88 88
    L50 108
    L12 88
    L12 22
    Z
  " fill="#1a1a1a"/>
  <!-- Inner cutout for the S shape (white on dark background) -->
  <!-- Top gap (top of S, opens to the right) -->
  <path d="
    M28 22
    L62 22
    L62 34
    L40 34
    L40 52
    L62 52
    L62 64
    L28 64
    L28 52
    L52 52
    L52 34
    L28 34
    Z
  " fill="white"/>
  <!-- Bottom gap (bottom of S, opens to the left) -->
  <path d="
    M38 52
    L72 52
    L72 64
    L50 64
    L50 76
    L72 76
    L72 88
    L38 88
    L38 76
    L60 76
    L60 64
    L38 64
    Z
  " fill="white"/>
</svg>
