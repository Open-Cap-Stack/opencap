name: Publish @opencapstack/mcp-server

on:
  push:
    tags:
      - 'mcp-v*'

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@opencapstack'

      - name: Install dependencies
        working-directory: packages/opencap-mcp
        run: npm ci

      - name: Build
        working-directory: packages/opencap-mcp
        run: npm run build

      - name: Test
        working-directory: packages/opencap-mcp
        run: npm test

      - name: Publish to npm
        working-directory: packages/opencap-mcp
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
