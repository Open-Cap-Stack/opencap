[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "concurrently --names api,web --prefix-colors blue,green \"node app.js\" \"cd client && node_modules/.bin/next start -p 5173\""
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "opencapstack"
